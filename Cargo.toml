[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["third_party"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
machish = { path = "crates/machish" }
exports = { path = "crates/exports" }
darwin = { path = "crates/darwin" }
server = { path = "crates/server" }
starnix = { path = "crates/starnix" }
objc = { path = "crates/objc" }
prefix = { path = "crates/prefix" }
corefoundation = { path = "crates/corefoundation" }
foundation = { path = "crates/foundation" }
sdl3 = { path = "crates/sdl3" }
iokit = { path = "crates/iokit" }
appkit = { path = "crates/appkit" }
chrome = { path = "crates/chrome" }
applicationservices = { path = "crates/applicationservices" }
coreservices = { path = "crates/coreservices" }
audiotoolbox = { path = "crates/audiotoolbox" }
corevideo = { path = "crates/corevideo" }
iosurface = { path = "crates/iosurface" }
coreaudio = { path = "crates/coreaudio" }
contacts = { path = "crates/contacts" }
avfoundation = { path = "crates/avfoundation" }
security = { path = "crates/security" }
gamecontroller = { path = "crates/gamecontroller" }
webkit = { path = "crates/webkit" }
forcefeedback = { path = "crates/forcefeedback" }
network = { path = "crates/network" }
opencl = { path = "crates/opencl" }
metal_translate = { path = "crates/metal_translate" }
metal = { path = "crates/metal" }
ash = "0.38"
libc = "0.2"
half = "2.7.1"
libm = "0.2"
backtrace = "0.3"
gimli = "0.34"
getrandom = "0.3"
rustls-pki-types = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "cookies"] }
static_init = "1.0.4"
owned_ttf_parser = "0.25"
ab_glyph_rasterizer = "0.1.9"
rust-fontconfig = { version = "5.0.1", default-features = false, features = ["std", "parsing", "multithreading"] }
llvm-bitcode = "0.4.0"
rspirv = "0.13.0"
sha2 = "0.11.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
aes = "0.9.3"
blowfish = "0.10.0"
cast5 = "0.12.0"
cipher = "0.5.2"
des = "0.9.0"
rc2 = "0.9.0"
rc4 = "0.2.0"
rustix = { version = "1.1.5", features = ["time", "thread", "process", "net"] }

# mimalloc with a fork gate and a block check, which darwin's malloc needs for
# libmalloc's guarantees. See third_party/libmimalloc-sys/ROSEMARY.md.
[patch.crates-io]
libmimalloc-sys = { path = "third_party/libmimalloc-sys" }

[profile.fullnative]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
