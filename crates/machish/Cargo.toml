[package]
name = "machish"
description = "A templatable, no_std-core Mach-O loader and dynamic linker"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["std", "arch-all", "fixups-all", "ext-dyld"]
std = ["dep:libc"]

arch-x86_64 = []
arch-arm64 = []
arch-all = ["arch-x86_64", "arch-arm64"]

fixups-dyld-info = []
fixups-chained = []
fixups-classic = []
fixups-all = ["fixups-dyld-info", "fixups-chained", "fixups-classic"]

ext-initializers = []
ext-tlv = []
ext-objc = []
ext-interpose = []
ext-dyld = ["ext-initializers", "ext-tlv", "ext-objc", "ext-interpose"]

# The example links a real binary against the host, so it needs both the host
# frontend and the guest architecture. Declared here so `--no-default-features`
# still builds - that configuration is what proves the `no_std` core.
[[example]]
name = "link"
required-features = ["std", "arch-x86_64"]

[dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
# Only for tests that verify a resolved address is a real host image address
# via `dladdr`. The crate itself keeps `libc` optional and `std`-gated.
libc = { workspace = true }

[lints]
workspace = true
