[package]
name = "webkit"
description = "Reimplementation of the WebKit framework over WebKitGTK"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
exports.workspace = true
appkit.workspace = true
objc.workspace = true
corefoundation.workspace = true
prefix.workspace = true
darwin.workspace = true
foundation.workspace = true
libc.workspace = true
sdl3.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "backend_drm",
    "backend_egl",
    "backend_vulkan",
    "renderer_gl",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[lints]
workspace = true
