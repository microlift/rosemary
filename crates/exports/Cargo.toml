[package]
name = "exports"
description = "How a module declares the symbols it publishes to a guest, once."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The loader's library as a sink. Off by default because `objc` and the
# framework crates know nothing about Mach-O and must not gain that edge; only
# `darwin` and `rosemary`, which already build a `SyntheticDylib`, turn it on.
machish = ["dep:machish"]

[dependencies]
machish = { workspace = true, optional = true }

[lints]
workspace = true
